name: Marin vLLM Cache Investigation

on:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: "Read-only inventory or native guard checks"
        type: choice
        default: inventory
        options: [inventory, guard, both]

permissions:
  contents: read

concurrency:
  group: cache-investigation-01a10d2b-${{ inputs.cache_mode }}
  cancel-in-progress: false

jobs:
  inventory:
    if: inputs.cache_mode != 'guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv venv --python 3.12
      - name: Measure readable cache packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python infra/release/cache_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: cache-inventory-01a10d2b
          path: artifacts/cache-inventory.json
          retention-days: 14

  guard:
    if: inputs.cache_mode != 'inventory'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    env:
      CACHE_REF: ghcr.io/marin-community/vllm-build-cache:guard-01a10d2b-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Exercise ordinary builds and stop before an uncached compile
        run: |
          mkdir -p probe compiler-cache artifacts
          cat > probe/Dockerfile <<'DOCKERFILE'
          FROM busybox AS build
          ARG VARIANT=seed
          ARG MARIN_CACHE_FIRST=0
          RUN --mount=type=cache,target=/compiler-cache,sharing=locked \
              --mount=type=secret,id=marin-compile-cache \
              if [ "$MARIN_CACHE_FIRST" = "1" ] && [ ! -f /run/secrets/marin-compile-cache ]; then exit 42; fi \
              && echo "$VARIANT" >> /compiler-cache/calls \
              && if [ -f /compiler-cache/object ]; then cp /compiler-cache/object /result; else echo "compiled-$VARIANT" > /result; fi
          FROM busybox AS inspect
          ARG NONCE
          RUN --mount=type=cache,target=/compiler-cache,sharing=locked \
              test -n "$NONCE" && mkdir -p /export && cp -a /compiler-cache/. /export/
          FROM scratch AS inspect-export
          COPY --from=inspect /export/ /
          FROM scratch AS wheel
          COPY --from=build /result /result
          DOCKERFILE
          docker buildx build --target wheel --build-arg VARIANT=ordinary --output type=local,dest=ordinary probe 2>&1 | tee artifacts/ordinary.log
          test "$(cat ordinary/result)" = compiled-ordinary
          if docker buildx build --target wheel --build-arg MARIN_CACHE_FIRST=1 --output type=local,dest=cold probe > artifacts/cold.log 2>&1; then exit 1; fi
          grep -q 'exit code: 42' artifacts/cold.log
          docker buildx build --target inspect-export --build-arg NONCE=before --output type=local,dest=before probe
          test "$(cat before/calls)" = ordinary
          echo reused-compiler-output > compiler-cache/object
      - uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          skip-extraction: true
          cache-map: '{"compiler-cache": "/compiler-cache"}'
      - name: Compile with loaded files and export layers
        run: |
          touch "$RUNNER_TEMP/marin-compile-cache"
          docker buildx build --target wheel --build-arg MARIN_CACHE_FIRST=1 \
            --secret id=marin-compile-cache,src="$RUNNER_TEMP/marin-compile-cache" \
            --cache-to type=registry,ref="$CACHE_REF",mode=max,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true \
            --output type=local,dest=loaded probe 2>&1 | tee artifacts/loaded.log
          cmp compiler-cache/object loaded/result
      - name: Reuse layers on a fresh builder without loading compiler files
        run: |
          docker buildx create --name guard-warm --driver docker-container --use
          docker buildx build --target wheel --build-arg MARIN_CACHE_FIRST=1 \
            --cache-from type=registry,ref="$CACHE_REF" \
            --output type=local,dest=warm probe 2>&1 | tee artifacts/warm.log
          cmp compiler-cache/object warm/result
          docker buildx build --target inspect-export --build-arg NONCE=after --output type=local,dest=after probe
          test ! -e after/calls
          if docker buildx build --target wheel --build-arg MARIN_CACHE_FIRST=1 --build-arg VARIANT=changed \
            --cache-from type=registry,ref="$CACHE_REF" --output type=local,dest=changed probe > artifacts/changed.log 2>&1; then exit 1; fi
          grep -q 'exit code: 42' artifacts/changed.log
      - uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          skip-extraction: true
          cache-map: '{"compiler-cache": "/compiler-cache"}'
      - name: Restore compiler files after an input change
        run: |
          docker buildx build --target wheel --build-arg MARIN_CACHE_FIRST=1 --build-arg VARIANT=changed \
            --secret id=marin-compile-cache,src="$RUNNER_TEMP/marin-compile-cache" \
            --output type=local,dest=changed probe 2>&1 | tee artifacts/retry.log
          cmp compiler-cache/object changed/result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-smoke-${{ matrix.architecture }}
          path: artifacts/
          retention-days: 14

name: Marin vLLM Build and Release

# GPU wheels build and qualify on main, then publish once.
# The manual TPU lane packages the two supplied commits.

on:
  push:
    branches: [main]
    # These paths do not alter packaged wheel bytes. Dispatch on main to
    # exercise changes to release automation.
    paths-ignore:
      - ".agents/**"
      - "AGENTS.md"
      - ".github/workflows/marin-ci.yaml"
      - ".github/workflows/marin-gpu-candidate.yaml"
      - ".github/workflows/marin-gpu-release.yaml"
      - "infra/nightly/specs/qwen3-0.6b-tpu.json"
      - "infra/release/README.md"
      - "infra/release/gpu_validation.py"
      - "infra/release/tpu_config.json"
      - "infra/release/tpu_release.py"
      - "infra/release/tpu_validation.py"
      - "infra/release/validation_common.py"
      - "infra/release/tests/**"
  workflow_dispatch:
    inputs:
      lane:
        description: "Build lane"
        required: true
        default: gpu
        type: choice
        options:
          - gpu
          - tpu
      vllm_commit:
        description: "Exact vLLM package source for the TPU lane"
        required: true
        default: 4c1c798a7b6072aab4f435b0fe0eb9e3ae9e5e19
        type: string
      tpu_inference_commit:
        description: "Exact tpu-inference package source for the TPU lane"
        required: true
        default: 29548fbab663b7ea946546ca7efaa473dab55ba5
        type: string
      exclude_newer:
        description: "UTC dependency cutoff for the TPU pair"
        required: true
        default: "2026-09-13T03:00:00Z"
        type: string

concurrency:
  group: marin-vllm-${{ inputs.lane || 'gpu' }}-build-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_CONFIG: infra/release/config.json
  TPU_RELEASE_CONFIG: infra/release/tpu_config.json
  UV_VERSION: "0.11.21"

jobs:
  prepare:
    name: Resolve main build
    if: github.event_name == 'push' || inputs.lane == 'gpu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      build: ${{ steps.source.outputs.build }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      validation_matrix: ${{ steps.matrix.outputs.validation_matrix }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      created_at: ${{ steps.source.outputs.created_at }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the main commit and release tag
        id: source
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "GPU builds must run from main." >&2
            exit 1
          fi
          CREATED_AT=$(git show -s --format=%cI "$GITHUB_SHA")
          RELEASE_DATE=$(date -u -d "$CREATED_AT" +%Y%m%d)
          RELEASE_TAG="marin-vllm-gpu-${RELEASE_DATE}-${GITHUB_SHA:0:12}"
          BUILD=true
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            BUILD=false
          fi
          {
            echo "build=${BUILD}"
            echo "release_tag=${RELEASE_TAG}"
            echo "created_at=${CREATED_AT}"
          } >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6
        if: steps.source.outputs.build == 'true'
        with:
          version: ${{ env.UV_VERSION }}

      - name: Read build and validation platforms
        id: matrix
        if: steps.source.outputs.build == 'true'
        run: |
          uv venv --python 3.12
          MATRIX=$(.venv/bin/python infra/release/gpu_release.py build-matrix --config "$RELEASE_CONFIG")
          VALIDATION_MATRIX=$(.venv/bin/python infra/release/gpu_release.py validation-matrix --config "$RELEASE_CONFIG")
          {
            echo "matrix=${MATRIX}"
            echo "validation_matrix=${VALIDATION_MATRIX}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.architecture }} wheel
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 480
    env:
      DOCKER_BUILDKIT: "1"
      DOCKER_BUILD_SUMMARY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reclaim runner disk and add swap
        run: |
          # The CUDA-13 compile peaks past the runner's ~16GB RAM and OOM-kills the
          # runner agent mid-build. Free disk and back the memory spikes with a
          # large swapfile so each matrix build fits its hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h /
          free -h

      - uses: docker/setup-buildx-action@v3

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the metadata environment
        run: uv venv --python 3.12

      - name: Resolve source and builder provenance
        id: provenance
        run: |
          git remote add upstream https://github.com/vllm-project/vllm.git 2>/dev/null || \
            git remote set-url upstream https://github.com/vllm-project/vllm.git
          git fetch --quiet --no-tags upstream main
          UPSTREAM_BASE=$(git merge-base upstream/main "$GITHUB_SHA")

          VERSION_DATE=$(date -u -d "${{ needs.prepare.outputs.created_at }}" +%Y%m%d)
          VERSION_TAG="v0.0.0.dev${VERSION_DATE}+marin.$(git rev-parse --short=12 "$GITHUB_SHA")"
          while read -r tag; do
            [[ -z "$tag" ]] || git tag --delete "$tag"
          done < <(git tag --points-at "$GITHUB_SHA")
          git tag "$VERSION_TAG" "$GITHUB_SHA"

          printf '%s\n' \
            "Source: $GITHUB_SHA" \
            "Upstream base: $UPSTREAM_BASE" \
            "Build base: ${{ matrix.build_base_image }}" \
            "CUDA: ${{ matrix.cuda_version }}; SM targets: ${{ matrix.sm_targets }}" \
            "MAX_JOBS: ${{ matrix.max_jobs }}; NVCC_THREADS: ${{ matrix.nvcc_threads }}"

          {
            echo "upstream_base=${UPSTREAM_BASE}"
            echo "base_image_digest=${{ matrix.build_base_image }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # Persist compiler outputs, not the multi-GB base layers. sccache hashes the
      # compiler, flags, environment, architecture, and preprocessed native inputs,
      # so this cache can span commits without reusing incompatible outputs. These
      # steps are best-effort so a cache hiccup never fails the pin-critical build.
      - name: Restore the CUDA compile cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: sccache-cache
          key: marin-vllm-cu132-sccache-v1-${{ matrix.architecture }}-${{ github.sha }}
          restore-keys: |
            marin-vllm-cu132-sccache-v1-${{ matrix.architecture }}-

      - name: Load the compile cache into the builder
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          cache-map: |
            {
              "sccache-cache": "/root/.cache/sccache"
            }

      - name: Build and export the CUDA 13.2 wheel
        run: |
          mkdir -p artifacts
          # GitHub Actions transports the mounted local cache. Clear upstream's
          # default S3 bucket so sccache uses that directory instead.
          docker buildx build \
            --target marin-wheel-export \
            --output type=local,dest=artifacts \
            --build-arg BUILD_OS=manylinux \
            --build-arg BUILD_BASE_IMAGE="${{ matrix.build_base_image }}" \
            --build-arg UV_CONSTRAINT=/opt/marin-gpu-constraints.txt \
            --build-arg CUDA_VERSION="${{ matrix.cuda_version }}" \
            --build-arg PYTHON_VERSION="${{ matrix.python_version }}" \
            --build-arg torch_cuda_arch_list="${{ matrix.sm_targets }}" \
            --build-arg max_jobs="${{ matrix.max_jobs }}" \
            --build-arg VLLM_MAX_SIZE_MB="${{ matrix.max_wheel_size_mb }}" \
            --build-arg nvcc_threads="${{ matrix.nvcc_threads }}" \
            --build-arg USE_SCCACHE=1 \
            --build-arg SCCACHE_BUCKET_NAME= \
            --build-arg GIT_REPO_CHECK=1 \
            --build-arg RUN_WHEEL_CHECK=true \
            --progress plain \
            -f docker/Dockerfile .

      - name: Tag the wheel
        run: |
          source .buildkite/scripts/lib/manylinux.sh
          WHEELS=(artifacts/dist/*.whl)
          if [[ ${#WHEELS[@]} -ne 1 ]]; then
            echo "Expected one wheel, found ${#WHEELS[@]}" >&2
            exit 1
          fi
          apply_manylinux_tag "${WHEELS[0]}"

      - name: Inspect wheel metadata and contents
        run: |
          WHEELS=(artifacts/dist/*.whl)
          .venv/bin/python infra/release/gpu_release.py inspect-wheel \
            --config "$RELEASE_CONFIG" \
            --wheel "${WHEELS[0]}" \
            --architecture "${{ matrix.architecture }}" \
            --fork-commit "$GITHUB_SHA" \
            --upstream-base "${{ steps.provenance.outputs.upstream_base }}" \
            --built-at "${{ steps.provenance.outputs.built_at }}" \
            --base-image "${{ matrix.build_base_image }}" \
            --base-image-digest "${{ steps.provenance.outputs.base_image_digest }}" \
            --output "artifacts/marin-vllm-${{ matrix.architecture }}-fragment.json"
          mv "${WHEELS[0]}" artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: marin-vllm-gpu-build-${{ matrix.architecture }}
          path: |
            artifacts/*.whl
            artifacts/marin-vllm-${{ matrix.architecture }}-fragment.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  assemble:
    name: Assemble build metadata
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the metadata environment
        run: uv venv --python 3.12

      - uses: actions/download-artifact@v4
        with:
          pattern: marin-vllm-gpu-build-*
          path: build
          merge-multiple: true

      - name: Assemble the release manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          CREATED_AT: ${{ needs.prepare.outputs.created_at }}
        run: |
          FRAGMENT_ARGS=()
          while IFS= read -r fragment; do
            FRAGMENT_ARGS+=(--fragment "$fragment")
          done < <(find build -maxdepth 1 -name '*-fragment.json' -print | sort)
          .venv/bin/python infra/release/gpu_release.py assemble-manifest \
            --config "$RELEASE_CONFIG" \
            "${FRAGMENT_ARGS[@]}" \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --created-at "$CREATED_AT" \
            --output build/marin-vllm-gpu-manifest.json
          .venv/bin/python infra/release/gpu_release.py verify-assets \
            --manifest build/marin-vllm-gpu-manifest.json \
            --directory build \
            --config "$RELEASE_CONFIG"

      - uses: actions/upload-artifact@v4
        with:
          name: marin-vllm-gpu-manifest
          path: build/marin-vllm-gpu-manifest.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  validate:
    name: Validate ${{ matrix.hardware }} wheel
    needs: [prepare, assemble]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.validation_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_USER: vllm-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: marin-vllm-gpu-manifest
          path: build

      - name: Materialize this commit's validation sources
        run: |
          mkdir validation-source
          set -o pipefail
          git archive "$GITHUB_SHA" -- \
            . ':(exclude)vllm' ':(exclude)docs' | \
            tar -x -C validation-source

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the metadata environment
        run: uv venv --python 3.12

      - name: Trim the Iris bundle
        # The installed wheel and validation-source/ provide the code under test.
        # Keep the uploaded source bundle below Iris's 25MB cap.
        run: git rm -r --quiet docs vllm tests csrc rust benchmarks examples

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hai-gcp-models
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: hai-gcp-models

      - name: Install the Iris client
        run: |
          uv tool install --prerelease allow "marin-core>=0.2.46.dev202607131620"
          echo "$(uv tool dir)/marin-core/bin" >> "$GITHUB_PATH"

      - name: Locate this run's wheel artifact
        env:
          ARTIFACT_NAME: marin-vllm-gpu-build-${{ matrix.architecture }}
        run: |
          WHEEL_ARTIFACT_URL=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\").archive_download_url")
          test -n "$WHEEL_ARTIFACT_URL"
          echo "WHEEL_ARTIFACT_URL=$WHEEL_ARTIFACT_URL" >> "$GITHUB_ENV"

      - name: Validate the built wheel on ${{ matrix.hardware }}
        id: iris
        continue-on-error: true
        env:
          JOB_NAME: vllm-release-${{ matrix.hardware }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          MODEL: Qwen/Qwen3-0.6B
        run: |
          TASK_IMAGE=$(jq -r '.validation_task_image' "$RELEASE_CONFIG")
          JOB_NAME=$(echo "$JOB_NAME" | cut -c1-63 | tr '[:upper:]' '[:lower:]')
          echo "JOB_NAME=${JOB_NAME}" >> "$GITHUB_ENV"
          set -o pipefail
          iris --cluster marin job run \
            --target-cluster "${{ matrix.target_cluster }}" \
            --priority production \
            --job-name "$JOB_NAME" \
            --user "$JOB_USER" \
            --task-image "$TASK_IMAGE" \
            --gpu "${{ matrix.gpu_resource }}" --enable-extra-resources \
            --cpu "${{ matrix.cpu }}" \
            --memory "${{ matrix.memory }}" \
            --disk 200GB \
            --env-vars GH_TOKEN "$GH_TOKEN" \
            --no-sync \
            --max-retries 0 \
            --timeout 2400 \
            -- uv run --no-project --python 3.12 python \
              infra/release/gpu_validation.py validate \
              --config "$RELEASE_CONFIG" \
              --manifest build/marin-vllm-gpu-manifest.json \
              --wheel-artifact-url "$WHEEL_ARTIFACT_URL" \
              --architecture "${{ matrix.architecture }}" \
              --hardware "${{ matrix.hardware }}" \
              --task-image "$TASK_IMAGE" \
              --model "$MODEL" \
              --validation-source-root validation-source 2>&1 | tee validation.log

      - name: Cancel any Iris job left behind
        if: always()
        run: |
          if [[ -n "${JOB_NAME:-}" ]]; then
            iris --cluster marin job cancel --exact "/$JOB_USER/$JOB_NAME" || true
          fi

      - name: Wait for the federated validation record
        if: steps.iris.outcome == 'success'
        env:
          FORWARDED_LOG_POLL_ATTEMPTS: 60
          FORWARDED_LOG_POLL_INTERVAL: 15
        run: |
          validation_record_ready() {
            .venv/bin/python infra/release/gpu_release.py extract-validation \
              --log "$1" --output validation-probe.json &&
              .venv/bin/python infra/release/gpu_release.py validate-result \
                --result validation-probe.json \
                --manifest build/marin-vllm-gpu-manifest.json \
                --config "$RELEASE_CONFIG" >/dev/null 2>&1
          }
          if validation_record_ready validation.log; then
            exit 0
          fi
          for attempt in $(seq 1 "$FORWARDED_LOG_POLL_ATTEMPTS"); do
            sleep "$FORWARDED_LOG_POLL_INTERVAL"
            iris --cluster marin job logs "/$JOB_USER/$JOB_NAME" > forwarded-validation.log 2>&1
            if validation_record_ready forwarded-validation.log; then
              cat forwarded-validation.log >> validation.log
              exit 0
            fi
            echo "Validation record has not reached the Marin Finelog hub (attempt ${attempt}/${FORWARDED_LOG_POLL_ATTEMPTS})."
          done
          cat forwarded-validation.log >> validation.log
          echo "Timed out waiting for the federated validation record." >&2
          exit 1

      - name: Extract the validation record
        if: always()
        run: |
          HARDWARE=$(echo "${{ matrix.hardware }}" | tr '[:upper:]' '[:lower:]')
          .venv/bin/python infra/release/gpu_release.py extract-validation \
            --log validation.log \
            --output "marin-vllm-validation-${HARDWARE}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marin-vllm-validation-${{ matrix.hardware }}
          path: |
            marin-vllm-validation-*.json
            validation.log
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Enforce validation result
        if: always()
        run: |
          if [[ "${{ steps.iris.outcome }}" != "success" ]]; then
            echo "Iris validation command failed." >&2
            exit 1
          fi
          HARDWARE=$(echo "${{ matrix.hardware }}" | tr '[:upper:]' '[:lower:]')
          .venv/bin/python infra/release/gpu_release.py validate-result \
            --result "marin-vllm-validation-${HARDWARE}.json" \
            --manifest build/marin-vllm-gpu-manifest.json \
            --config "$RELEASE_CONFIG"

  publish:
    name: Publish qualified wheels
    needs: [prepare, assemble, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the metadata environment
        run: uv venv --python 3.12

      - uses: actions/download-artifact@v4
        with:
          name: marin-vllm-gpu-manifest
          path: build

      - uses: actions/download-artifact@v4
        with:
          pattern: marin-vllm-gpu-build-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: marin-vllm-validation-*
          path: validations
          merge-multiple: true

      - name: Attach this run's qualification results
        run: |
          VALIDATION_ARGS=()
          while IFS= read -r result; do
            VALIDATION_ARGS+=(--validation "$result")
            cp "$result" release-assets/
          done < <(find validations -name 'marin-vllm-validation-*.json' -print | sort)
          .venv/bin/python infra/release/gpu_release.py finalize-release \
            --manifest build/marin-vllm-gpu-manifest.json \
            "${VALIDATION_ARGS[@]}" \
            --config "$RELEASE_CONFIG" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output release-assets/marin-vllm-gpu-manifest.json
          .venv/bin/python infra/release/gpu_release.py verify-release \
            --manifest release-assets/marin-vllm-gpu-manifest.json \
            --directory release-assets \
            --config "$RELEASE_CONFIG"
          .venv/bin/python infra/release/gpu_release.py release-notes \
            --manifest release-assets/marin-vllm-gpu-manifest.json \
            --output release-notes.md

      - name: Publish release assets once
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Marin vLLM GPU ${RELEASE_TAG#marin-vllm-gpu-}" \
            --latest \
            --notes-file release-notes.md \
            release-assets/*.whl \
            release-assets/marin-vllm-gpu-manifest.json \
            release-assets/marin-vllm-validation-*.json

  publish-tpu:
    name: Build and publish exact TPU wheel pair
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'tpu'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the metadata environment
        run: uv venv --python "$(jq -r '.python_version' "$TPU_RELEASE_CONFIG")" .metadata

      - name: Read exact package sources
        id: pair
        run: |
          for commit in "${{ inputs.vllm_commit }}" "${{ inputs.tpu_inference_commit }}"; do
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "TPU package sources must be full lowercase Git SHAs." >&2
              exit 1
            fi
          done
          if [[ ! "${{ inputs.exclude_newer }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "exclude_newer must be a whole-second UTC timestamp." >&2
            exit 1
          fi
          VLLM_VERSION=$(.metadata/bin/python infra/release/tpu_release.py package-version \
            --config "$TPU_RELEASE_CONFIG" \
            --distribution vllm \
            --source-commit "${{ inputs.vllm_commit }}")
          TPU_VERSION=$(.metadata/bin/python infra/release/tpu_release.py package-version \
            --config "$TPU_RELEASE_CONFIG" \
            --distribution tpu-inference \
            --source-commit "${{ inputs.tpu_inference_commit }}")
          {
            echo "vllm_commit=${{ inputs.vllm_commit }}"
            echo "tpu_commit=${{ inputs.tpu_inference_commit }}"
            echo "exclude_newer=${{ inputs.exclude_newer }}"
            echo "python_version=$(jq -r '.python_version' "$TPU_RELEASE_CONFIG")"
            echo "target_device=$(jq -r '.vllm_target_device' "$TPU_RELEASE_CONFIG")"
            echo "vllm_repository=$(jq -r '.repositories.vllm' "$TPU_RELEASE_CONFIG")"
            echo "tpu_repository=$(jq -r '.repositories["tpu-inference"]' "$TPU_RELEASE_CONFIG")"
            echo "vllm_version=${VLLM_VERSION}"
            echo "tpu_version=${TPU_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact vLLM source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pair.outputs.vllm_repository }}
          ref: ${{ steps.pair.outputs.vllm_commit }}
          fetch-depth: 0
          path: sources/vllm
          persist-credentials: false

      - name: Checkout exact tpu-inference source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pair.outputs.tpu_repository }}
          ref: ${{ steps.pair.outputs.tpu_commit }}
          fetch-depth: 0
          path: sources/tpu-inference
          persist-credentials: false

      - name: Build both Python 3.12 wheels
        run: |
          [[ "$(git -C sources/vllm rev-parse HEAD)" == "${{ steps.pair.outputs.vllm_commit }}" ]]
          [[ "$(git -C sources/tpu-inference rev-parse HEAD)" == "${{ steps.pair.outputs.tpu_commit }}" ]]
          mkdir candidate
          (
            cd sources/vllm
            uv venv --python "${{ steps.pair.outputs.python_version }}" .tpu-wheel-build
            uv pip install \
              --python .tpu-wheel-build/bin/python \
              --exclude-newer "${{ steps.pair.outputs.exclude_newer }}" \
              --index-strategy unsafe-best-match \
              --requirements requirements/build/tpu.txt
            VLLM_TARGET_DEVICE="${{ steps.pair.outputs.target_device }}" \
              VLLM_VERSION_OVERRIDE="${{ steps.pair.outputs.vllm_version }}" \
              uv build --wheel \
                --no-build-isolation \
                --python .tpu-wheel-build/bin/python \
                --exclude-newer "${{ steps.pair.outputs.exclude_newer }}" \
                --out-dir "$GITHUB_WORKSPACE/candidate"
          )
          (
            cd sources/tpu-inference
            VLLM_VERSION_OVERRIDE="${{ steps.pair.outputs.tpu_version }}" uv build --wheel \
              --python "${{ steps.pair.outputs.python_version }}" \
              --exclude-newer "${{ steps.pair.outputs.exclude_newer }}" \
              --out-dir "$GITHUB_WORKSPACE/candidate"
          )
          WHEELS=(candidate/*.whl)
          if [[ ${#WHEELS[@]} -ne 2 ]]; then
            echo "Expected two wheels, found ${#WHEELS[@]}" >&2
            exit 1
          fi

      - name: Assemble and verify pair manifest
        id: manifest
        run: |
          CREATED_AT=$(git show -s --format=%cI "$GITHUB_SHA")
          WHEEL_ARGS=()
          while IFS= read -r wheel; do
            WHEEL_ARGS+=(--wheel "$wheel")
          done < <(find candidate -maxdepth 1 -name '*.whl' -print | sort)
          .metadata/bin/python infra/release/tpu_release.py assemble-candidate \
            --config "$TPU_RELEASE_CONFIG" \
            "${WHEEL_ARGS[@]}" \
            --repository "$GITHUB_REPOSITORY" \
            --vllm-commit "${{ steps.pair.outputs.vllm_commit }}" \
            --tpu-inference-commit "${{ steps.pair.outputs.tpu_commit }}" \
            --workflow-commit "$GITHUB_SHA" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --created-at "$CREATED_AT" \
            --exclude-newer "${{ steps.pair.outputs.exclude_newer }}" \
            --output candidate/marin-vllm-tpu-manifest.json
          .metadata/bin/python infra/release/tpu_release.py write-index \
            --manifest candidate/marin-vllm-tpu-manifest.json \
            --directory candidate
          .metadata/bin/python infra/release/tpu_release.py verify-candidate \
            --config "$TPU_RELEASE_CONFIG" \
            --manifest candidate/marin-vllm-tpu-manifest.json \
            --directory candidate
          .metadata/bin/python infra/release/tpu_release.py release-notes \
            --manifest candidate/marin-vllm-tpu-manifest.json \
            --output candidate-notes.md
          CANDIDATE_TAG=$(jq -r '.release.tag' candidate/marin-vllm-tpu-manifest.json)
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish candidate assets once
        env:
          CANDIDATE_TAG: ${{ steps.manifest.outputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing candidate $CANDIDATE_TAG" >&2
            exit 1
          fi
          gh release create "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Marin vLLM TPU candidate ${CANDIDATE_TAG#marin-vllm-tpu-candidate-}" \
            --notes-file candidate-notes.md \
            --prerelease \
            candidate/*.whl \
            candidate/*.html \
            candidate/marin-vllm-tpu-manifest.json

      - name: Redownload the published pair
        env:
          CANDIDATE_TAG: ${{ steps.manifest.outputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          gh release download "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published

      - name: Verify the published assets
        env:
          CANDIDATE_TAG: ${{ steps.manifest.outputs.candidate_tag }}
        run: |
          .metadata/bin/python infra/release/tpu_release.py verify-candidate \
            --config "$TPU_RELEASE_CONFIG" \
            --manifest published/marin-vllm-tpu-manifest.json \
            --directory published \
            --expected-tag "$CANDIDATE_TAG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marin-vllm-tpu-candidate-${{ github.run_id }}
          path: candidate/marin-vllm-tpu-manifest.json
          if-no-files-found: ignore
          retention-days: 14

name: Check Marin registry cache on fresh native builders
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3
        id: builder
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Export and import layers on two fresh builders
        env:
          CACHE_REF: ghcr.io/marin-community/vllm-build-cache:smoke-${{ matrix.architecture }}
        run: |
          set -o pipefail
          mkdir -p context evidence first second
          printf '%s\n' 'FROM busybox AS build' 'RUN echo stable-cache-input > /marker' 'FROM scratch' 'COPY --from=build /marker /marker' > context/Dockerfile
          docker buildx build --cache-to type=registry,ref="$CACHE_REF",mode=max,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true,ignore-error=true --output type=local,dest=first context --progress plain 2>&1 | tee evidence/first.log
          docker buildx imagetools inspect "$CACHE_REF" --raw > evidence/manifest.json
          docker buildx create --driver docker-container --name "fresh-$GITHUB_RUN_ID" --use
          docker buildx build --cache-from type=registry,ref="$CACHE_REF" --output type=local,dest=second context --progress plain 2>&1 | tee evidence/second.log
          cmp first/marker second/marker
          grep CACHED evidence/second.log
          docker buildx rm "fresh-$GITHUB_RUN_ID"
          docker buildx use "${{ steps.builder.outputs.name }}"
          docker logout ghcr.io
          docker buildx build --cache-from type=registry,ref="$CACHE_REF" --cache-to type=registry,ref="$CACHE_REF",mode=max,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true,ignore-error=true --output type=local,dest=fallback context --progress plain 2>&1 | tee evidence/fallback.log
          cmp first/marker fallback/marker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-smoke-${{ matrix.architecture }}
          path: evidence/
          retention-days: 14

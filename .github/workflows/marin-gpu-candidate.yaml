name: Marin vLLM Candidate

# Marin fork only. GPU candidates follow main. The manual TPU lane packages the
# two exact source commits supplied by the caller.

on:
  push:
    branches: [main]
    # These paths do not alter packaged wheel bytes. Candidate-workflow changes
    # remain testable through workflow_dispatch.
    paths-ignore:
      - ".agents/**"
      - "AGENTS.md"
      - ".github/workflows/marin-ci.yaml"
      - ".github/workflows/marin-gpu-candidate.yaml"
      - ".github/workflows/marin-gpu-release.yaml"
      - ".github/workflows/marin-cache-retention.yaml"
      - "infra/nightly/specs/qwen3-0.6b-tpu.json"
      - "infra/release/README.md"
      - "infra/release/gpu_validation.py"
      - "infra/release/tpu_config.json"
      - "infra/release/tpu_release.py"
      - "infra/release/tpu_validation.py"
      - "infra/release/validation_common.py"
      - "infra/release/tests/**"
  workflow_dispatch:
    inputs:
      lane:
        description: "Candidate lane"
        required: true
        default: gpu
        type: choice
        options:
          - gpu
          - tpu
      gpu_mode:
        description: "GPU candidate mode"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - stage
          - qualify
          - qualify-x86_64
          - qualify-aarch64
      vllm_commit:
        description: "Exact vLLM package source for the TPU lane"
        required: true
        default: 39e62869693c46402b1a95fde4fc55ca1aab9ae1
        type: string
      tpu_inference_commit:
        description: "Exact tpu-inference package source for the TPU lane"
        required: true
        default: 66c5d8952eec0c263361915cb4613d8f30737955
        type: string
      exclude_newer:
        description: "UTC dependency cutoff for the TPU pair"
        required: true
        default: "2026-10-04T20:00:00Z"
        type: string

concurrency:
  group: marin-vllm-${{ inputs.lane || 'gpu' }}-candidate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_CONFIG: infra/release/config.json
  TPU_RELEASE_CONFIG: infra/release/tpu_config.json
  UV_VERSION: "0.11.21"

jobs:
  prepare:
    name: Resolve build matrix
    if: github.event_name == 'push' || inputs.lane == 'gpu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      candidate_tag: ${{ steps.source.outputs.candidate_tag }}
      created_at: ${{ steps.source.outputs.created_at }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the metadata environment
        run: uv venv --python 3.12

      - name: Read the release platforms
        id: matrix
        env:
          GPU_MODE: ${{ inputs.gpu_mode || 'publish' }}
        run: |
          MATRIX=$(.venv/bin/python infra/release/gpu_release.py build-matrix --config "$RELEASE_CONFIG")
          if [[ "$GPU_MODE" == qualify-* ]]; then
            ARCHITECTURE=${GPU_MODE#qualify-}
            MATRIX=$(jq -c --arg architecture "$ARCHITECTURE" \
              '{include: [.include[] | select(.architecture == $architecture)]}' \
              <<< "$MATRIX")
            if [[ $(jq '.include | length' <<< "$MATRIX") -ne 1 ]]; then
              echo "Unknown GPU candidate mode: $GPU_MODE" >&2
              exit 1
            fi
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Resolve the immutable candidate identity
        id: source
        env:
          GPU_MODE: ${{ inputs.gpu_mode || 'publish' }}
        run: |
          if [[ "$GPU_MODE" == stage && "$GITHUB_REF" != refs/heads/main-next ]]; then
            echo "GPU staging must run from refs/heads/main-next." >&2
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short=12 "$GITHUB_SHA")
          CREATED_AT=$(git show -s --format=%cI "$GITHUB_SHA")
          CANDIDATE_PREFIX=marin-vllm-gpu-candidate
          if [[ "$GPU_MODE" == stage ]]; then
            CANDIDATE_PREFIX=marin-vllm-gpu-staged-candidate
          fi
          {
            echo "candidate_tag=${CANDIDATE_PREFIX}-${SHORT_SHA}"
            echo "created_at=${CREATED_AT}"
          } >> "$GITHUB_OUTPUT"

      - name: Require an approved GPU source lane for publication
        if: >-
          github.event_name == 'push' ||
          inputs.gpu_mode == 'publish' ||
          inputs.gpu_mode == 'stage'
        run: |
          .venv/bin/python infra/release/gpu_release.py verify-candidate-lineage \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_REF" \
            --source-commit "$GITHUB_SHA" \
            --candidate-tag "${{ steps.source.outputs.candidate_tag }}"

  build:
    name: Build ${{ matrix.architecture }} wheel
    needs: prepare
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 480
    env:
      DOCKER_BUILDKIT: "1"
      DOCKER_BUILD_SUMMARY: "false"
      BUILD_CACHE_REF: ghcr.io/marin-community/vllm-build-cache:${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reclaim runner disk and add swap
        run: |
          # The CUDA-13 compile peaks past the runner's ~16GB RAM and OOM-kills the
          # runner agent mid-build. Free disk and back the memory spikes with a
          # large swapfile so each matrix build fits its hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h /
          free -h

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate the shared build-layer cache
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the metadata environment
        run: uv venv --python 3.12

      - name: Resolve source and builder provenance
        id: provenance
        run: |
          git remote add upstream https://github.com/vllm-project/vllm.git 2>/dev/null || \
            git remote set-url upstream https://github.com/vllm-project/vllm.git
          UPSTREAM_RELEASE=$(jq -r '.upstream_release' "$RELEASE_CONFIG")
          UPSTREAM_BASE=$(jq -r '.upstream_base' "$RELEASE_CONFIG")
          git fetch --quiet --no-tags upstream "refs/tags/$UPSTREAM_RELEASE"
          if [[ $(git rev-parse 'FETCH_HEAD^{commit}') != "$UPSTREAM_BASE" ]]; then
            echo "Selected upstream release no longer matches its frozen commit." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$UPSTREAM_BASE" "$GITHUB_SHA"

          VERSION_DATE=$(date -u -d "${{ needs.prepare.outputs.created_at }}" +%Y%m%d)
          VERSION_TAG="v0.0.0.dev${VERSION_DATE}+marin.$(git rev-parse --short=12 "$GITHUB_SHA")"
          while read -r tag; do
            [[ -z "$tag" ]] || git tag --delete "$tag"
          done < <(git tag --points-at "$GITHUB_SHA")
          git tag "$VERSION_TAG" "$GITHUB_SHA"

          printf '%s\n' \
            "Source: $GITHUB_SHA" \
            "Upstream base: $UPSTREAM_BASE" \
            "Build base: ${{ matrix.build_base_image }}" \
            "CUDA: ${{ matrix.cuda_version }}; SM targets: ${{ matrix.sm_targets }}" \
            "MAX_JOBS: ${{ matrix.max_jobs }}; NVCC_THREADS: ${{ matrix.nvcc_threads }}"

          {
            echo "upstream_base=${UPSTREAM_BASE}"
            echo "base_image_digest=${{ matrix.build_base_image }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_date_epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate the shared compiler cache
        id: cache-auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/748532799086/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
          service_account: github-iris@hai-gcp-models.iam.gserviceaccount.com
          export_environment_variables: false

      - name: Build and export the CUDA 13.2 wheel
        run: |
          mkdir -p artifacts
          CACHE_AUTH=()
          if [[ -f "${{ steps.cache-auth.outputs.credentials_file_path }}" ]]; then
            CACHE_AUTH=(--secret "id=gcs-credentials,src=${{ steps.cache-auth.outputs.credentials_file_path }}")
          fi
          docker buildx build \
            --target marin-wheel-export \
            --output type=local,dest=artifacts \
            --cache-from type=registry,ref="$BUILD_CACHE_REF" \
            --cache-to type=registry,ref="$BUILD_CACHE_REF",mode=max,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true,ignore-error=true \
            --build-arg BUILD_OS=manylinux \
            --build-arg BUILD_BASE_IMAGE="${{ matrix.build_base_image }}" \
            --build-arg UV_CONSTRAINT=/opt/marin-gpu-constraints.txt \
            --build-arg MARIN_GPU_CONSTRAINT_FILE="${{ matrix.constraints_file }}" \
            --build-arg MARIN_FIXED_CUDA_COMPILER=true \
            --build-arg MARIN_SOURCE_DATE_EPOCH="${{ steps.provenance.outputs.source_date_epoch }}" \
            --build-arg CUDA_VERSION="${{ matrix.cuda_version }}" \
            --build-arg PYTHON_VERSION="${{ matrix.python_version }}" \
            --build-arg torch_cuda_arch_list="${{ matrix.sm_targets }}" \
            --build-arg max_jobs="${{ matrix.max_jobs }}" \
            --build-arg VLLM_MAX_SIZE_MB="${{ matrix.max_wheel_size_mb }}" \
            --build-arg nvcc_threads="${{ matrix.nvcc_threads }}" \
            --build-arg USE_SCCACHE=1 \
            --build-arg SCCACHE_BUCKET_NAME= \
            --build-arg SCCACHE_GCS_BUCKET=marin-public \
            --build-arg SCCACHE_GCS_KEY_PREFIX="build-cache/vllm/sccache-v1/${{ matrix.architecture }}/" \
            --build-arg SCCACHE_GCS_RW_MODE=READ_WRITE \
            --build-arg SCCACHE_GCS_KEY_PATH=/run/secrets/gcs-credentials \
            --build-arg SCCACHE_IGNORE_SERVER_IO_ERROR=1 \
            --build-arg GIT_REPO_CHECK=1 \
            --build-arg RUN_WHEEL_CHECK=true \
            "${CACHE_AUTH[@]}" \
            --progress plain \
            -f docker/Dockerfile .

      - name: Tag the wheel
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          source .buildkite/scripts/lib/manylinux.sh
          WHEELS=(artifacts/dist/*.whl)
          if [[ ${#WHEELS[@]} -ne 1 ]]; then
            echo "Expected one wheel, found ${#WHEELS[@]}" >&2
            exit 1
          fi
          apply_manylinux_tag "${WHEELS[0]}"

      - name: Inspect wheel metadata and contents
        run: |
          WHEELS=(artifacts/dist/*.whl)
          .venv/bin/python infra/release/gpu_release.py inspect-wheel \
            --config "$RELEASE_CONFIG" \
            --wheel "${WHEELS[0]}" \
            --architecture "${{ matrix.architecture }}" \
            --fork-commit "$GITHUB_SHA" \
            --upstream-base "${{ steps.provenance.outputs.upstream_base }}" \
            --built-at "${{ steps.provenance.outputs.built_at }}" \
            --base-image "${{ matrix.build_base_image }}" \
            --base-image-digest "${{ steps.provenance.outputs.base_image_digest }}" \
            --compiler-provenance artifacts/compiler-provenance.json \
            --output "artifacts/marin-vllm-${{ matrix.architecture }}-fragment.json"
          mv "${WHEELS[0]}" artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: marin-vllm-gpu-candidate-${{ matrix.architecture }}
          path: |
            artifacts/*.whl
            artifacts/marin-vllm-${{ matrix.architecture }}-fragment.json
            artifacts/compiler-provenance.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable candidate
    needs: [prepare, build]
    if: >-
      github.event_name == 'push' ||
      inputs.gpu_mode == 'publish' ||
      inputs.gpu_mode == 'stage'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the metadata environment
        run: uv venv --python 3.12

      - uses: actions/download-artifact@v4
        with:
          pattern: marin-vllm-gpu-candidate-*
          path: candidate
          merge-multiple: true

      - name: Assemble the candidate manifest
        run: |
          FRAGMENT_ARGS=()
          while IFS= read -r fragment; do
            FRAGMENT_ARGS+=(--fragment "$fragment")
          done < <(find candidate -maxdepth 1 -name '*-fragment.json' -print | sort)
          .venv/bin/python infra/release/gpu_release.py assemble-candidate \
            --config "$RELEASE_CONFIG" \
            "${FRAGMENT_ARGS[@]}" \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-tag "$CANDIDATE_TAG" \
            --created-at "${{ needs.prepare.outputs.created_at }}" \
            --output candidate/marin-vllm-gpu-manifest.json
          .venv/bin/python infra/release/gpu_release.py verify-assets \
            --manifest candidate/marin-vllm-gpu-manifest.json \
            --directory candidate \
            --config "$RELEASE_CONFIG"
          .venv/bin/python infra/release/gpu_release.py release-notes \
            --manifest candidate/marin-vllm-gpu-manifest.json \
            --output candidate-notes.md

      - name: Check for an existing immutable candidate
        id: existing
        run: |
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            mkdir existing
            gh release download "$CANDIDATE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir existing
            .venv/bin/python infra/release/gpu_release.py verify-assets \
              --manifest existing/marin-vllm-gpu-manifest.json \
              --directory existing \
              --config "$RELEASE_CONFIG"
            .venv/bin/python infra/release/gpu_release.py verify-published-candidate \
              --manifest existing/marin-vllm-gpu-manifest.json \
              --repository "$GITHUB_REPOSITORY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish candidate assets once
        if: steps.existing.outputs.exists != 'true'
        run: |
          SOURCE_COMMIT=$(jq -r '.source.fork_commit' candidate/marin-vllm-gpu-manifest.json)
          if [[ "$SOURCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Candidate source $SOURCE_COMMIT does not match workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          .venv/bin/python infra/release/gpu_release.py verify-candidate-lineage \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --candidate-tag "$CANDIDATE_TAG"
          gh release create "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Marin vLLM GPU candidate $(git rev-parse --short=12 "$GITHUB_SHA")" \
            --notes-file candidate-notes.md \
            --prerelease \
            candidate/*.whl \
            candidate/marin-vllm-gpu-manifest.json

      - name: Verify published candidate assets
        if: steps.existing.outputs.exists != 'true'
        run: |
          mkdir published
          gh release download "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published
          .venv/bin/python infra/release/gpu_release.py verify-assets \
            --manifest published/marin-vllm-gpu-manifest.json \
            --directory published \
            --config "$RELEASE_CONFIG"

  publish-tpu:
    name: Build and publish exact TPU wheel pair
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'tpu'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Create the metadata environment
        run: uv venv --python "$(jq -r '.python_version' "$TPU_RELEASE_CONFIG")" .metadata

      - name: Read exact package sources
        id: pair
        run: |
          for commit in "${{ inputs.vllm_commit }}" "${{ inputs.tpu_inference_commit }}"; do
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "TPU package sources must be full lowercase Git SHAs." >&2
              exit 1
            fi
          done
          if [[ ! "${{ inputs.exclude_newer }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "exclude_newer must be a whole-second UTC timestamp." >&2
            exit 1
          fi
          VLLM_VERSION=$(.metadata/bin/python infra/release/tpu_release.py package-version \
            --config "$TPU_RELEASE_CONFIG" \
            --distribution vllm \
            --source-commit "${{ inputs.vllm_commit }}")
          TPU_VERSION=$(.metadata/bin/python infra/release/tpu_release.py package-version \
            --config "$TPU_RELEASE_CONFIG" \
            --distribution tpu-inference \
            --source-commit "${{ inputs.tpu_inference_commit }}")
          {
            echo "vllm_commit=${{ inputs.vllm_commit }}"
            echo "tpu_commit=${{ inputs.tpu_inference_commit }}"
            echo "exclude_newer=${{ inputs.exclude_newer }}"
            echo "python_version=$(jq -r '.python_version' "$TPU_RELEASE_CONFIG")"
            echo "target_device=$(jq -r '.vllm_target_device' "$TPU_RELEASE_CONFIG")"
            echo "vllm_repository=$(jq -r '.repositories.vllm' "$TPU_RELEASE_CONFIG")"
            echo "tpu_repository=$(jq -r '.repositories["tpu-inference"]' "$TPU_RELEASE_CONFIG")"
            echo "vllm_version=${VLLM_VERSION}"
            echo "tpu_version=${TPU_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Build both wheels with the portable TPU recipe
        run: |
          mkdir tpu-builder-context candidate
          uv venv --python 3.12.13 .tpu-builder-inputs
          uv pip install --python .tpu-builder-inputs/bin/python "uv==$UV_VERSION"
          cp .tpu-builder-inputs/bin/uv tpu-builder-context/uv
          docker build \
            --tag marin-tpu-builder:release \
            --file infra/release/Dockerfile.tpu-build \
            tpu-builder-context
          docker image inspect marin-tpu-builder:release \
            --format '{{.Id}}' > candidate/builder-image.txt
          docker run --name marin-tpu-pair-build --cpus 1 --memory 4g \
            --mount type=bind,source="$GITHUB_WORKSPACE/infra/release/build_tpu_pair.sh",target=/recipe.sh,readonly \
            marin-tpu-builder:release nice -n 10 bash /recipe.sh \
            "${{ steps.pair.outputs.vllm_commit }}" \
            "${{ steps.pair.outputs.tpu_commit }}" \
            "${{ steps.pair.outputs.exclude_newer }}"
          docker cp marin-tpu-pair-build:/work/pair/. candidate/
          WHEELS=(candidate/*.whl)
          if [[ ${#WHEELS[@]} -ne 2 ]]; then
            echo "Expected two wheels, found ${#WHEELS[@]}" >&2
            exit 1
          fi

      - name: Assemble and verify pair manifest
        id: manifest
        run: |
          CREATED_AT=$(git show -s --format=%cI "$GITHUB_SHA")
          WHEEL_ARGS=()
          while IFS= read -r wheel; do
            WHEEL_ARGS+=(--wheel "$wheel")
          done < <(find candidate -maxdepth 1 -name '*.whl' -print | sort)
          .metadata/bin/python infra/release/tpu_release.py assemble-candidate \
            --config "$TPU_RELEASE_CONFIG" \
            "${WHEEL_ARGS[@]}" \
            --repository "$GITHUB_REPOSITORY" \
            --vllm-commit "${{ steps.pair.outputs.vllm_commit }}" \
            --tpu-inference-commit "${{ steps.pair.outputs.tpu_commit }}" \
            --workflow-commit "$GITHUB_SHA" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --created-at "$CREATED_AT" \
            --exclude-newer "${{ steps.pair.outputs.exclude_newer }}" \
            --output candidate/marin-vllm-tpu-manifest.json
          .metadata/bin/python infra/release/tpu_release.py write-index \
            --manifest candidate/marin-vllm-tpu-manifest.json \
            --directory candidate
          .metadata/bin/python infra/release/tpu_release.py verify-candidate \
            --config "$TPU_RELEASE_CONFIG" \
            --manifest candidate/marin-vllm-tpu-manifest.json \
            --directory candidate
          .metadata/bin/python infra/release/tpu_release.py release-notes \
            --manifest candidate/marin-vllm-tpu-manifest.json \
            --output candidate-notes.md
          CANDIDATE_TAG=$(jq -r '.release.tag' candidate/marin-vllm-tpu-manifest.json)
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish candidate assets once
        env:
          CANDIDATE_TAG: ${{ steps.manifest.outputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing candidate $CANDIDATE_TAG" >&2
            exit 1
          fi
          gh release create "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Marin vLLM TPU candidate ${CANDIDATE_TAG#marin-vllm-tpu-candidate-}" \
            --notes-file candidate-notes.md \
            --prerelease \
            candidate/*.whl \
            candidate/*.html \
            candidate/marin-vllm-tpu-manifest.json \
            candidate/*.txt \
            candidate/*.sha256

      - name: Redownload the published pair
        env:
          CANDIDATE_TAG: ${{ steps.manifest.outputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          gh release download "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published

      - name: Verify the published assets
        env:
          CANDIDATE_TAG: ${{ steps.manifest.outputs.candidate_tag }}
        run: |
          .metadata/bin/python infra/release/tpu_release.py verify-candidate \
            --config "$TPU_RELEASE_CONFIG" \
            --manifest published/marin-vllm-tpu-manifest.json \
            --directory published \
            --expected-tag "$CANDIDATE_TAG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marin-vllm-tpu-candidate-${{ github.run_id }}
          path: candidate/marin-vllm-tpu-manifest.json
          if-no-files-found: ignore
          retention-days: 14

name: Marin build-cache retention

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  packages: write

concurrency:
  group: marin-cache-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: vllm-build-cache
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: "true"
